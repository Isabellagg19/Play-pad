<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Pad</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barrio&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap" rel="stylesheet">
</head>

<body>
    <h1>Play Pad</h1>
    <div class="pad">
        <div class="box" onclick="play ('do.mp3')">Do</div>
        <div class="box" onclick="play ('re.mp3')">Re</div>
        <div class="box" onclick="play ('mi.mp3')">Mi</div>
        <div class="box" onclick="play ('fa.mp3')">Fa</div>
        <div class="box" onclick="play ('sol.mp3')">Sol</div>
        <div class="box" onclick="play ('la.mp3')">La</div>
        <div class="box" onclick="play ('si.mp3')">Si</div>
        <div class="box" onclick="play ('sound-effect0.mp3')">SE1</div>
        <div class="box" onclick="play ('sound-effect1.mp3')">SE2</div>
        <div class="box" onclick="play('sound-effect2.mp3')">SE3</div>
        <div class="box" onclick="play('sound-effect3.mp3')">SE4</div>
        <div class="box" onclick="play('sound-effect4.mp3')">SE5</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
