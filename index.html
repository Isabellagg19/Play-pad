<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Pad</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barrio&display=swap" rel="stylesheet">
</head>

<body>
    <h1>Play Pad</h1>
    <div class="pad">
        <div class="box" onclick="play ('do.mp3')">A</div>
        <div class="box" onclick="play ('re.mp3')">B</div>
        <div class="box" onclick="play ('mi.mp3')">C</div>
        <div class="box" onclick="play ('fa.mp3')">D</div>
        <div class="box" onclick="play ('sol.mp3')">E</div>
        <div class="box" onclick="play ('la.mp3')">F</div>
        <div class="box" onclick="play ('si.mp3')">G</div>
        <div class="box" onclick="">H</div>
        <div class="box" onclick="">I</div>
        <div class="box" onclick="">J</div>
        <div class="box" onclick="">K</div>
        <div class="box" onclick="">L</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
