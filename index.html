<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Pad</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

<body>
    <h1>Play Pad</h1>
    <div class="pad">
        <div class="box a" onclick="play ('do.mp3')">C</div>
        <div class="box a" onclick="play ('re.mp3')">D</div>
        <div class="box a" onclick="play ('mi.mp3')">E</div>
        <div class="box a" onclick="play ('fa.mp3')">F</div>
        <div class="box a" onclick="play ('sol.mp3')">G</div>
        <div class="box a" onclick="play ('la.mp3')">A</div>
        <div class="box a" onclick="play ('si.mp3')">B</div>
        <div class="box b" onclick="play ('sound-effect0.mp3')">SE1</div>
        <div class="box b" onclick="play ('sound-effect1.mp3')">SE2</div>
        <div class="box b" onclick="play('sound-effect2.mp3')">SE3</div>
        <div class="box b" onclick="play('sound-effect3.mp3')">SE4</div>
        <div class="box c" onclick="play('melody1.mp3')">M1</div>
        <div class="box c" onclick="play('melody2.mp3')">M2</div>
        <div class="box c" onclick="play('melody3.mp3')">M3</div>
        <div class="box c" onclick="play('melody4.mp3')">M4</div>
        <div class="box c" onclick="play('melody5.mp3')">M5</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
